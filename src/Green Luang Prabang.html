<!doctype html>
<html lang="lo">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Green Luang Prabang</title>
    <meta
      name="description"
      content="Green Luang Prabang brings people together to reduce waste, protect nature and turn discarded materials into opportunities for local communities."
    />
    <meta property="og:title" content="Green Luang Prabang" />
    <meta
      property="og:description"
      content="A greener Luang Prabang starts with us."
    />
    <meta property="og:type" content="website" />
    <script>
      try {
        if (sessionStorage.getItem("glp-intro"))
          document.documentElement.classList.add("seen");
      } catch (e) {}
      document.documentElement.classList.add("js");
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.cdnfonts.com/css/phetsarath" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link href="./output.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              forest: "#0d4a34",
              deep: "#0a3b2a",
              leaf: "#3f8f5a",
              mist: "#bfe3e8",
              paper: "#fbfaf6",
              sand: "#efece0",
              earth: "#8a5a2b",
            },
            fontFamily: {
              sans: ["Phetsarath", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Plus Jakarta Sans", "Phetsarath", sans-serif;
        background-color: #fff;
      }

      body.font-sans {
        font-family: "Plus Jakarta Sans", "Phetsarath", sans-serif;
      }

      .bg-nature-gradient {
        background: #fff;
      }

      .hero-section {
        isolation: isolate;
        background: #fbfaf6;
        color: #0a3b2a;
      }

      .hero-image-mask {
        -webkit-mask-image:
          linear-gradient(
            to right,
            transparent 0%,
            rgba(0, 0, 0, 0.15) 15%,
            rgba(0, 0, 0, 0.65) 40%,
            #000 75%
          ),
          linear-gradient(
            to bottom,
            transparent 0%,
            #000 15%,
            #000 85%,
            transparent 100%
          );
        -webkit-mask-composite: source-in;
        mask-image:
          linear-gradient(
            to right,
            transparent 0%,
            rgba(0, 0, 0, 0.15) 15%,
            rgba(0, 0, 0, 0.65) 40%,
            #000 75%
          ),
          linear-gradient(
            to bottom,
            transparent 0%,
            #000 15%,
            #000 85%,
            transparent 100%
          );
        mask-composite: intersect;
      }

      .hero-fog-left,
      .hero-fog-edges {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .hero-fog-left {
        background: linear-gradient(
          to right,
          #fbfaf6 0%,
          rgba(251, 250, 246, 0.9) 18%,
          rgba(251, 250, 246, 0.7) 40%,
          rgba(251, 250, 246, 0.1) 70%,
          transparent 100%
        );
      }

      .hero-fog-edges {
        background: linear-gradient(
          to bottom,
          rgba(251, 250, 246, 0.1) 0%,
          transparent 16%,
          transparent 82%,
          #fbfaf6 100%
        );
      }

      .hero-mist {
        position: absolute;
        z-index: 3;
        border-radius: 9999px;
        filter: blur(48px);
        pointer-events: none;
        animation: mistFloat 18s ease-in-out infinite;
      }

      .hero-mist-one {
        top: -5rem;
        right: 25%;
        width: min(600px, 70vw);
        aspect-ratio: 1;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.15),
          rgba(251, 250, 246, 0.1),
          transparent
        );
      }

      .hero-mist-two {
        right: 2.5rem;
        bottom: 2.5rem;
        width: min(500px, 60vw);
        aspect-ratio: 1;
        background: linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.1),
          rgba(251, 250, 246, 0.1),
          transparent
        );
        animation-delay: -9s;
      }

      @keyframes mistFloat {
        0% {
          transform: translate(0, 0) scale(1);
          opacity: 0.75;
        }
        50% {
          transform: translate(-25px, 15px) scale(1.08);
          opacity: 0.9;
        }
        100% {
          transform: translate(0, 0) scale(1);
          opacity: 0.75;
        }
      }

      /* Card backdrop blur with subtle shadow */
      .glass-card {
        background: rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow:
          0 10px 30px -5px rgba(0, 0, 0, 0.04),
          0 4px 12px -2px rgba(0, 0, 0, 0.02);
      }

      .glass-card:hover {
        box-shadow:
          0 20px 35px -5px rgba(45, 80, 45, 0.08),
          0 8px 16px -4px rgba(0, 0, 0, 0.03);
      }

      .brush-badge {
        background: #2d8a39;
        border-radius: 40px 15px 45px 12px / 15px 40px 12px 45px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      }

      .shadow-custom {
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
      }

      .community-badge-glass {
        background-color: rgba(251, 250, 246, 0.1);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(13, 74, 52, 0.1);
      }

      @keyframes aboutImageTransition {
        from {
          transform: scale(1.025);
        }
        to {
          transform: scale(1);
        }
      }

      .about-image-transition {
        transform-origin: center;
        animation: aboutImageTransition 300ms ease-out;
      }

      @media (prefers-reduced-motion: reduce) {
        .about-image-transition {
          animation: none;
        }
      }

      main > section {
        background: #fbfaf6;
      }

      .bg-brand-offwhite:not(section) {
        border-color: rgba(13, 74, 52, 0.1);
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(10px);
      }

      .issues-link-button {
        border: 1px solid rgba(255, 255, 255, 0.75);
        background: rgba(255, 255, 255, 0.3);
        box-shadow:
          inset 0 0 15px rgba(255, 255, 255, 0.02),
          inset 0 0 8px rgba(147, 251, 213, 0.06),
          0 8px 24px rgba(13, 74, 52, 0.1);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
      }

      .issues-link-button:hover,
      .issues-link-button:focus-visible {
        background: rgba(255, 255, 255, 0.82);
        box-shadow:
          inset 0 2px 8px rgba(255, 255, 255, 0.9),
          inset 0 -2px 8px rgba(13, 74, 52, 0.04),
          0 12px 28px rgba(13, 74, 52, 0.14);
      }

      #Issues .issue-card:hover,
      #Issues .issue-card:focus-within {
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 18px 36px rgba(13, 74, 52, 0.16);
        transform: translateY(-4px);
      }

      .values-mindmap {
        position: relative;
        display: grid;
        gap: 1.5rem 0;
      }

      .values-mindmap::before {
        position: absolute;
        top: 0.5rem;
        bottom: 0.5rem;
        left: 50%;
        width: 2px;
        background: linear-gradient(to bottom, #34d399, #0d4a34 50%, #a3e635);
        content: "";
        transform: translateX(-50%);
      }

      .value-branch-row {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 3rem minmax(0, 1fr);
        align-items: center;
      }

      .value-branch {
        position: relative;
        padding: 1.25rem;
        border: 1px solid rgba(13, 74, 52, 0.12);
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 8px 24px rgba(13, 74, 52, 0.07);
      }

      .value-branch::before {
        position: absolute;
        top: 50%;
        width: 1.5rem;
        height: 2px;
        background: var(--branch-color);
        content: "";
      }

      .value-branch-left {
        grid-column: 1;
      }

      .value-branch-left::before {
        right: -1.5rem;
      }

      .value-branch-right {
        grid-column: 3;
      }

      .value-branch-right::before {
        left: -1.5rem;
      }

      .value-branch-responsibility {
        --branch-color: #059669;
      }

      .value-branch-respect {
        --branch-color: #0284c7;
      }

      .value-branch-volunteers {
        --branch-color: #d97706;
      }

      .value-branch-sustainability {
        --branch-color: #65a30d;
      }

      .value-branch-icon {
        color: var(--branch-color);
      }

      .value-map-node {
        z-index: 1;
        grid-column: 2;
        grid-row: 1;
        justify-self: center;
        width: 1rem;
        height: 1rem;
        border: 3px solid #fbfaf6;
        border-radius: 9999px;
        background: var(--branch-color);
        box-shadow: 0 0 0 2px var(--branch-color);
      }

      .text-brand-800 {
        color: #0a3b2a;
      }

      .text-slate-600 {
        color: rgba(10, 59, 42, 0.72);
      }

      #about .bg-white,
      #gallery .gallery-item {
        border-color: rgba(13, 74, 52, 0.1);
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(10px);
      }

      #projects button,
      #projects .project-details-link,
      #Issues button {
        border-color: #0d4a34;
        color: #0d4a34;
        transition:
          color 180ms ease,
          background-color 180ms ease,
          box-shadow 180ms ease,
          transform 180ms ease;
      }

      #projects button:hover,
      #projects .project-details-link:hover,
      #Issues button:hover {
        background-color: #0d4a34;
        color: #fff;
        border-color: #0d4a34;
        box-shadow: inset 0 2px 15px rgb(255, 255, 255, 1),
              inset 0 0 30px rgba(235, 239, 238, 0.2);
        transform: translateY(-1px);
      }

      #projects .button {
        box-shadow:
          inset 0 0 10px rgba(218, 230, 225, 1),
          inset 0 0 30px rgba(235, 239, 238, 0.06);
      }

      #projects button:hover .project-button-icon {
        transform: translateX(4px) rotate(-45deg);
      }

      #projects .project-details-link:hover .project-button-icon {
        transform: translateX(4px) rotate(-45deg);
      }

      #home a[href="#projects"]:hover .project-button-icon,
      #home a[href="#projects"]:focus-visible .project-button-icon {
        transform: translateX(4px) rotate(-45deg);
      }

      .hero-donate-icon {
        display: inline-block;
        transform-origin: center;
      }

      #home .hero-donate-button:hover .hero-donate-icon,
      #home .hero-donate-button:focus-visible .hero-donate-icon {
        animation: donateHeartBeat 600ms ease-in-out infinite;
      }

      @keyframes donateHeartBeat {
        0%,
        100% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.3);
        }
        65% {
          transform: scale(1.1);
        }
      }

      .scroll-indicator-arrow {
        animation: scrollArrowBounce 1.4s ease-in-out infinite;
      }

      .hero-scroll-cue {
        left: 50%;
        flex-direction: column;
        transform: translateX(-50%);
      }

      @keyframes scrollArrowBounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(4px);
        }
      }

      #hd.s {
        background-color: rgba(251, 250, 246, 0.1);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(13, 74, 52, 0.1);
        color: #0d4a34;
        box-shadow: 0 8px 24px rgba(13, 74, 52, 0.08);
      }

      #hd.s > div:first-child {
        background: transparent;
      }

      #hd .cta {
        background-color: #065f46;
        color: #fff;
        transition: background-color 300ms ease;
      }

      #mb svg path {
        transform-box: fill-box;
        transform-origin: center;
        transition:
          transform 250ms ease,
          opacity 180ms ease;
      }

      #mb[aria-expanded="true"] svg path:first-child {
        transform: translateY(5px) rotate(45deg);
      }

      #mb[aria-expanded="true"] svg path:nth-child(2) {
        opacity: 0;
      }

      #mb[aria-expanded="true"] svg path:last-child {
        transform: translateY(-5px) rotate(-45deg);
      }

      :focus-visible {
        outline-color: #3f8f5a;
      }

      @media (prefers-reduced-motion: reduce) {
        #projects button,
        #Issues button,
        .hero-mist,
        .project-button-icon,
        .hero-donate-icon,
        .scroll-indicator-arrow,
        #mb svg path {
          transition: none;
          animation: none;
        }
      }

      #gallery-filters
        .gallery-filter-btn[aria-pressed="true"]:not(
          [data-filter="all"]
        )::after {
        background-color: #0d4a34;
      }

      .donation-hero-badge {
        background: rgba(191, 227, 232, 0.45);
        border: 1px solid rgba(13, 74, 52, 0.1);
        box-shadow: 0 8px 24px rgba(13, 74, 52, 0.08);
      }

      .donation-hero-underline {
        filter: drop-shadow(0 8px 14px rgba(13, 74, 52, 0.12));
      }

      .donation-process-step {
        position: relative;
      }

      .donation-process-step:not(:last-child)::after {
        content: "";
        position: absolute;
        right: -0.8rem;
        top: 1.6rem;
        width: 1.1rem;
        height: 2px;
        background: rgba(13, 74, 52, 0.35);
      }

      #lang-switch::before {
        content: "";
        position: absolute;
        top: 0.25rem;
        bottom: 0.25rem;
        left: 0.25rem;
        width: calc((100% - 0.5rem) / 2);
        border-radius: 9999px;
        background-color: #064e3b;
        transition: transform 300ms cubic-bezier(0.2, 0.8, 0.2, 1);
        pointer-events: none;
      }

      #lang-switch:has([data-lang="en"].act)::before {
        transform: translateX(100%);
      }

      #lang-switch [data-lang] {
        position: relative;
        z-index: 1;
        transition: color 300ms ease;
      }

      #lang-switch [data-lang].act {
        background-color: transparent;
        transition: all 300ms ease;
        color: #fff;
      }

      @media (max-width: 640px) {
        .donation-process-step:not(:last-child)::after {
          display: none;
        }

        .values-mindmap {
          gap: 1rem;
          padding-left: 0.25rem;
        }

        .values-mindmap::before {
          left: 1rem;
        }

        .value-branch-row {
          grid-template-columns: 2rem minmax(0, 1fr);
        }

        .value-branch {
          grid-column: 2;
        }

        .value-branch::before {
          right: auto;
          left: -1rem;
          width: 1rem;
        }

        .value-map-node {
          grid-column: 1;
        }
      }
    </style>
  </head>
  <body class="text-deep antialiased">
    <!-- INTROSCREEN -->
    <div
      id="intro"
      class="fixed inset-0 z-50 overflow-hidden bg-deep text-white"
      role="dialog"
      aria-label="Green Luang Prabang"
    >
      <img
        id="ibg"
        src="Images/cj-fFL5K3A3uGo-unsplash.jpg"
        alt="Luang Prabang"
        aria-hidden="true"
        fetchpriority="high"
        class="absolute inset-0 h-full w-full object-cover"
      />
      <div
        class="absolute inset-0 bg-linear-to-b from-deep/40 via-deep/45 to-deep/80"
      ></div>
      <button
        id="skip"
        class="cta absolute bg-rgba(255, 255, 255, 0.08) text-white right-5 top-5 z-10 rounded-full border border-white/50 bg-transparent px-5 py-2 text-sm font-semibold sm:right-12 sm:top-8 transition-all duration-500 hover:bg-white hover:text-green-900"
        data-i18n="skip"
      ></button>
      <div
        class="relative flex h-full flex-col items-center justify-center px-6 text-center"
      >
        <p
          class="a1 text-sm font-semibold tracking-[.3em] text-white/75"
          data-i18n="i_loc"
        ></p>
        <h1
          class="a2 mt-5 text-[clamp(2.5rem,8vw,5.5rem)] font-bold leading-tight drop-shadow-lg"
        >
          Green Luang Prabang
        </h1>
        <p
          class="a3 mt-3 text-xl text-white/85 sm:text-2xl"
          data-i18n="i_tag"
        ></p>
        <button
          id="enter"
          class="a4 cta mt-10 rounded-full px-9 py-4 text-lg font-semibold shadow-xl transition-all duration-300 hover:-translate-y-1"
          style="background: #f6f7fb; color: #0d4a34"
          data-i18n="i_btn"
        ></button>
      </div>
    </div>

    <!-- HEADER -->
    <header
      id="hd"
      class="fixed inset-x-0 top-0 z-40 text-emerald-900 bg-paper/93 backdrop-blur-md transition-colors duration-300"
    >
      <div
        class="mx-auto flex h-18 max-w-7xl items-center justify-between gap-3 px-6 sm:px-12"
      >
        <a href="#home" class="flex items-center gap-3">
          <span
            class="grid h-14 w-14 shrink-0 place-items-center rounded-full border border-current/40 bg-white/10 p-0.5"
            ><img
              src="Images/Green LPB _ without background (1).png"
              alt="Green Luang Prabang"
            />
          </span>
          <span class="leading-tight"
            ><b class="block text-lg font-semibold sm:text-xl"
              >Green Luang Prabang</b
            ><small class="text-xs tracking-widest opacity-70"
              >LAOS · ລາວ</small
            ></span
          >
        </a>
        <div class="flex items-center gap-2 sm:gap-3">
          <div
            id="lang-switch"
            class="relative grid grid-cols-2 rounded-full border border-current/30 p-1 text-sm font-semibold"
            role="group"
            aria-label="Language"
          >
            <button
              data-lang="lo"
              class="rounded-full px-4 py-1.5 transition-colors duration-300"
            >
              ລາວ</button
            ><button
              data-lang="en"
              class="rounded-full px-4 py-1.5 transition-colors duration-300"
            >
              EN
            </button>
          </div>
          <button
            class="cta hidden rounded-full px-6 py-3 text-sm font-semibold sm:block"
            data-donate
            data-i18n="donate"
          ></button>
          <button
            id="mb"
            class="grid h-12 w-12 place-items-center rounded-full border border-current/40"
            aria-expanded="false"
            aria-controls="mp"
            aria-label="Menu"
          >
            <svg
              class="h-6 w-6"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M4 7h16" />
              <path d="M4 12h16" />
              <path d="M4 17h16" />
            </svg>
          </button>
        </div>
      </div>

      <nav
        id="mp"
        class="absolute right-4 top-24 hidden w-72 rounded-3xl bg-deep p-3 text-white shadow-2xl sm:right-12"
        aria-label="Main"
      ></nav>
    </header>

    <main>
      <!-- HERO -->
      <section
        id="home"
        class="hero-section relative flex min-h-screen items-center overflow-hidden pb-24 pt-28"
      >
        <img
          id="plx"
          src="Images/pexels-roman-odintsov-4553124.jpg"
          alt="Luang Prabang"
          aria-hidden="true"
          class="hero-image-mask absolute left-0 top-[-8%] h-[116%] w-full object-cover will-change-transform"
        />
        <div class="hero-fog-left z-1" aria-hidden="true"></div>
        <div class="hero-fog-edges z-2" aria-hidden="true"></div>
        <div class="hero-mist hero-mist-one" aria-hidden="true"></div>
        <div class="hero-mist hero-mist-two" aria-hidden="true"></div>
        <div
          class="absolute right-[8%] top-24 z-4 hidden h-34 w-34 rounded-full border border-deep/20 lg:block"
          aria-hidden="true"
        ></div>
        <svg
          class="fl absolute right-[18%] top-[30%] z-4 hidden h-10 w-20 text-leaf/70 md:block"
          aria-hidden="true"
        >
          <use href="#lf" />
        </svg>
        <div class="relative z-10 mx-auto w-full max-w-7xl px-4 sm:px-12">
          <p
            class="flex items-center gap-4 text-sm font-bold tracking-wider text-deep/75"
          >
            <span
              class="inline-flex items-center gap-2 rounded-full border border-solid border-deep/20 bg-white/10 px-4 py-1 shadow-[inset_0_0_8px_rgba(0,0,0,0.15)]"
              ><i
                class="fa-solid fa-tree text-emerald-700 text-xl"
                aria-hidden="true"
              ></i
              ><span data-i18n="eyebrow"></span
            ></span>
          </p>
          <h2 class="mt-8 max-w-2xl text-5xl font-bold leading-[1.2] space-y-2">
            <span class="block" data-i18n="h1"></span>
            <span class="block" data-i18n="h2"></span>
          </h2>
          <p
            class="mt-4 max-w-xl text-lg font-medium leading-relaxed text-gray-600 sm:text-xl"
            data-i18n="sub"
          ></p>
          <div class="mt-10 flex flex-wrap gap-4">
            <a
              href="#projects"
              class="inline-flex items-center gap-2 rounded-full bg-forest px-8 py-4 font-semibold text-white shadow-[inset_0_0_15px_white] transition duration-300 hover:bg-leaf"
            >
              <span data-i18n="explore"></span>
              <i
                class="project-button-icon ri-arrow-right-line"
                aria-hidden="true"
              ></i>
            </a>

      "Images_about_waste/807844603_1125502333376739_3445940055609772544_n.png",
      "Images_about_waste/817531727_1562734635043457_3580217784977164912_n.png",
      "Images_about_waste/832819428_1654885873006871_7689622961727614658_n.jpg",
      "Images_about_waste/840765525_1119456370732053_6804029758921597333_n.png",
      "Images_about_waste/854944080_1488870426418765_8871877238937711309_n.png",
    ];
    const aboutImage = document.getElementById("about-image");
    const aboutImageStatus = document.getElementById("about-image-status");
    let aboutImageIndex = 0;

    function showAboutImage(offset) {
      aboutImageIndex =
        (aboutImageIndex + offset + aboutImages.length) % aboutImages.length;
      aboutImage.src = aboutImages[aboutImageIndex];
      aboutImage.classList.remove("about-image-transition");
      void aboutImage.offsetWidth;
      aboutImage.classList.add("about-image-transition");
      aboutImageStatus.textContent = `Image ${aboutImageIndex + 1} of ${aboutImages.length}`;
    }

    document
      .getElementById("about-image-prev")
      .addEventListener("click", () => showAboutImage(-1));
    document
      .getElementById("about-image-next")
      .addEventListener("click", () => showAboutImage(1));
  </script>
</html>
